[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hem"
version = "0.1.0"
description = "A LangGraph-based workflow that analyzes job postings, extracts structured requirements, and iteratively tailors a markdown resume with human-in-the-loop review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-cli[inmem]>=0.1.55",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
]

[project.scripts]
hem = "hem.cli:main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "C4", "D"]
ignore = ["E501"]
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"
